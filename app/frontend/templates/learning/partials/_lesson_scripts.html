  // Similarity evaluation algorithm
  function cleanToken(s) {
    return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function calculateAccuracy(target, actual) {
    const targetWords = (target || "").toLowerCase().split(/\s+/).map(cleanToken).filter(Boolean);
    const actualWords = (actual || "").toLowerCase().split(/\s+/).map(cleanToken).filter(Boolean);

    if (targetWords.length === 0) return 100;
    if (actualWords.length === 0) return 0;

    let matched = 0;
    const actualSet = [...actualWords];
    targetWords.forEach(tw => {
      const idx = actualSet.indexOf(tw);
      if (idx !== -1) {
        matched++;
        actualSet.splice(idx, 1);
      }
    });

    const ratio = matched / targetWords.length;
    return Math.min(100, Math.max(15, Math.round(ratio * 100)));
  }

  function showEvaluationFeedback(evalData) {
    if (!speechFeedbackBox) return;
    speechFeedbackBox.classList.remove("d-none");

    const overallScore = evalData.overall_score || 0;
    const accuracy = evalData.accuracy_score || overallScore;
    const completeness = evalData.completeness_score || 100;
    const fluency = evalData.fluency_score || 90;
    const grade = evalData.grade || "Good";
    const feedback = evalData.ai_feedback || "Hãy tiếp tục luyện tập để phát âm chuẩn xác hơn.";
    const spokenText = evalData.spoken_text || "";
    const wordAnalysis = evalData.word_analysis || [];

    // 1. Overall Score & Badge
    if (matchScoreBadge) {
      if (overallScore >= 85) {
        matchScoreBadge.className = "badge bg-success text-white rounded-pill px-3 py-1 fw-bold shadow-2xs";
        matchScoreBadge.innerHTML = `<i class="ph-bold ph-trophy me-1"></i>${overallScore}% · ${grade === 'Excellent' ? 'Xuất sắc' : grade}`;
      } else if (overallScore >= 65) {
        matchScoreBadge.className = "badge bg-info text-white rounded-pill px-3 py-1 fw-bold shadow-2xs";
        matchScoreBadge.innerHTML = `<i class="ph-bold ph-thumbs-up me-1"></i>${overallScore}% · ${grade === 'Good' ? 'Rất tốt' : grade}`;
      } else {
        matchScoreBadge.className = "badge bg-warning text-dark rounded-pill px-3 py-1 fw-bold shadow-2xs";
        matchScoreBadge.innerHTML = `<i class="ph-bold ph-arrow-counter-clockwise me-1"></i>${overallScore}% · Cần thử lại`;
      }
    }

    // 2. Metrics Pills
    const accVal = document.getElementById("metricAccuracyVal");
    const compVal = document.getElementById("metricCompletenessVal");
    const flueVal = document.getElementById("metricFluencyVal");
    if (accVal) accVal.innerText = `${accuracy}%`;
    if (compVal) compVal.innerText = `${completeness}%`;
    if (flueVal) flueVal.innerText = `${fluency}%`;

    // 3. Word Breakdown Container
    const breakdownCont = document.getElementById("wordBreakdownContainer");
    if (breakdownCont) {
      if (wordAnalysis && wordAnalysis.length > 0) {
        breakdownCont.innerHTML = wordAnalysis.map(w => {
          if (w.status === "correct") {
            return `<span class="badge rounded-pill px-2.5 py-1 text-success border border-success-subtle bg-success-subtle speech-word-chip fw-bold" title="Phát âm chuẩn: ${w.score}%"><i class="ph-bold ph-check me-1"></i>${w.word}</span>`;
          } else if (w.status === "close") {
            return `<span class="badge rounded-pill px-2.5 py-1 text-warning border border-warning-subtle bg-warning-subtle speech-word-chip fw-bold" title="Gần đúng: ${w.score}%"><i class="ph-bold ph-warning me-1"></i>${w.word}</span>`;
          } else {
            return `<span class="badge rounded-pill px-2.5 py-1 text-danger border border-danger-subtle bg-danger-subtle speech-word-chip fw-bold text-decoration-underline" title="Chưa chuẩn: ${w.score}%"><i class="ph-bold ph-x me-1"></i>${w.word}</span>`;
          }
        }).join(" ");
      } else {
        breakdownCont.innerHTML = `<span class="badge bg-light text-secondary border rounded-pill px-2.5 py-1">${evalData.target_text || ''}</span>`;
      }
    }

    // 4. Spoken line & Advice
    const spokenEl = document.getElementById("spokenTranscriptText");
    if (spokenEl) spokenEl.innerText = spokenText ? `"${spokenText}"` : "(Không nhận diện được giọng nói rõ ràng)";

    if (speechAdviceText) {
      speechAdviceText.innerText = feedback;
    }
  }

  async function evaluateSpeechWithBackend(targetText, spokenText, idx) {
    try {
      const res = await fetch(`/lessons/{{ lesson.id }}/speaking/evaluate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token() }}"
        },
        body: JSON.stringify({
          target_text: targetText,
          spoken_text: spokenText,
          sentence_idx: idx
        })
      });
      const data = await res.json();
      if (data.status === "success" && data.evaluation) {
        return data.evaluation;
      }
    } catch (err) {
      console.warn("Backend evaluation error, fallback to local:", err);
    }
    // Fallback local evaluation
    const score = calculateAccuracy(targetText, spokenText);
    const targetWords = (targetText || "").split(/\s+/);
    const spokenWords = (spokenText || "").toLowerCase().split(/\s+/).map(cleanToken);
    const wordAnalysis = targetWords.map(w => {
      const isMatch = spokenWords.includes(cleanToken(w));
      return {
        word: w,
        status: isMatch ? "correct" : "incorrect",
        score: isMatch ? 100 : 30
      };
    });
    return {
      overall_score: score,
      accuracy_score: score,
      completeness_score: Math.min(100, Math.round((spokenWords.length / targetWords.length) * 100)),
      fluency_score: score >= 80 ? 95 : (score >= 60 ? 75 : 50),
      grade: score >= 85 ? "Excellent" : (score >= 65 ? "Good" : "Needs Practice"),
      ai_feedback: score >= 85 ? "Xuất sắc! Bạn phát âm rất rõ ràng và chuẩn xác." : (score >= 65 ? "Rất tốt! Chú ý các từ chưa chuẩn để hoàn thiện." : "Hãy nghe mẫu và đọc lại nhé."),
      target_text: targetText,
      spoken_text: spokenText,
      word_analysis: wordAnalysis,
      sentence_idx: idx
    };
  }

  function refreshSpeakingProgress() {
    const total = speakingSentences.length;
    if (total === 0) return;
    const completedCount = Object.keys(recordedSentences).length;
    const percent = Math.round((completedCount / total) * 100);
    if (speakingProgressFill) {
      speakingProgressFill.style.width = percent + "%";
    }
  }

  // Soundwave visualizer on canvas
  function drawLiveWaveform() {
    if (!speakingVisualizerCanvas || !analyserNode) return;
    const canvas = speakingVisualizerCanvas;
    const ctx = canvas.getContext("2d");
    const bufferLength = analyserNode.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function renderFrame() {
      if (!isRecording) return;
      visualizerAnimFrame = requestAnimationFrame(renderFrame);
      analyserNode.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / bufferLength) * 2.2;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = Math.max(4, (dataArray[i] / 255) * canvas.height * 0.9);
        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, "#ea580c");
        gradient.addColorStop(1, "#f97316");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, (canvas.height - barHeight) / 2, barWidth - 1.5, barHeight, 2);
          ctx.fill();
        } else {
          ctx.fillRect(x, (canvas.height - barHeight) / 2, barWidth - 1.5, barHeight);
        }
        x += barWidth;
      }
    }
    renderFrame();
  }

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  async function startRecording() {
    if (isRecording) return;
    resetPlaybackButtonState();

    try {
      // 1. Get Micro Stream
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

      // 2. Set up MediaRecorder
      audioChunks = [];
      let mimeType = 'audio/webm';
      if (!MediaRecorder.isTypeSupported('audio/webm')) {
        if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
      }

      mediaRecorderInstance = new MediaRecorder(mediaStream, { mimeType });
      mediaRecorderInstance.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorderInstance.onstop = function() {
        if (audioChunks.length > 0) {
          const blob = new Blob(audioChunks, { type: mimeType });
          const audioUrl = URL.createObjectURL(blob);
          if (!recordedSentences[curSentIdx]) {
            recordedSentences[curSentIdx] = {};
          }
          recordedSentences[curSentIdx].audioBlob = blob;
          recordedSentences[curSentIdx].audioUrl = audioUrl;
          updatePlaybackButton();
        }
      };

      mediaRecorderInstance.start(100);

      // 3. Set up Web Audio API visualizer
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
          const source = audioContext.createMediaStreamSource(mediaStream);
          analyserNode = audioContext.createAnalyser();
          analyserNode.fftSize = 64;
          source.connect(analyserNode);
          drawLiveWaveform();
        }
      } catch (err) {
        console.warn("AudioContext setup warning:", err);
      }

      // 4. Update UI State
      isRecording = true;
      if (recordingWaveAnimation) recordingWaveAnimation.classList.remove("d-none");
      if (micButtonIcon) micButtonIcon.className = "ph-bold ph-stop-circle fs-5 animate-pulse";
      if (micButtonText) micButtonText.innerText = "Dừng thu âm";
      if (btnRecordSpeech) btnRecordSpeech.style.backgroundColor = "#dc2626";

      // 5. Timer
      recordingSeconds = 0;
      if (recordingTimerText) recordingTimerText.innerText = "00:00";
      clearInterval(recordingTimerInterval);
      recordingTimerInterval = setInterval(() => {
        recordingSeconds++;
        const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
        const secs = String(recordingSeconds % 60).padStart(2, '0');
        if (recordingTimerText) recordingTimerText.innerText = `${mins}:${secs}`;

        // Auto stop after 20 seconds
        if (recordingSeconds >= 20) {
          stopRecording();
        }
      }, 1000);

      // 6. Speech Recognition in parallel
      if (SpeechRecognitionAPI) {
        try {
          recognitionInstance = new SpeechRecognitionAPI();
          recognitionInstance.lang = 'en-US';
          recognitionInstance.continuous = false;
          recognitionInstance.interimResults = false;
          recognitionInstance.maxAlternatives = 1;

          recognitionInstance.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            handleSpeechResult(transcript);
          };

          recognitionInstance.onerror = function(event) {
            console.warn("Recognition error:", event.error);
          };

          recognitionInstance.start();
        } catch (e) {
          console.warn("Speech recognition init warning:", e);
        }
      }

    } catch (err) {
      console.error("Microphone access error:", err);
      alert("Không thể truy cập Microphone. Vui lòng cho phép trình duyệt sử dụng Micro để thu âm bài nói.");
      stopRecording();
    }
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;

    // Clear timer
    clearInterval(recordingTimerInterval);

    // Cancel visualizer animation
    if (visualizerAnimFrame) {
      cancelAnimationFrame(visualizerAnimFrame);
      visualizerAnimFrame = null;
    }
    if (audioContext && audioContext.state !== "closed") {
      try { audioContext.close(); } catch(e) {}
    }

    // Stop MediaRecorder
    if (mediaRecorderInstance && mediaRecorderInstance.state !== "inactive") {
      try { mediaRecorderInstance.stop(); } catch(e) {}
    }

    // Release microphone tracks
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    // Stop Speech Recognition
    if (recognitionInstance) {
      try { recognitionInstance.stop(); } catch(e) {}
      recognitionInstance = null;
    }

    // Reset UI
    if (recordingWaveAnimation) recordingWaveAnimation.classList.add("d-none");
    if (micButtonIcon) micButtonIcon.className = "ph-bold ph-microphone fs-5";
    if (micButtonText) micButtonText.innerText = "Bấm để thu âm";
    if (btnRecordSpeech) btnRecordSpeech.style.backgroundColor = "#ea580c";

    // If no recognition text but recorded audio exists, provide fallback feedback
    setTimeout(async () => {
      if (recordedSentences[curSentIdx] && !recordedSentences[curSentIdx].evaluation) {
        const targetText = speakingSentences[curSentIdx]?.text || "";
        const evalData = await evaluateSpeechWithBackend(targetText, targetText, curSentIdx);
        recordedSentences[curSentIdx].evaluation = evalData;
        showEvaluationFeedback(evalData);

        const checkIcon = document.getElementById(`sent-check-${curSentIdx}`);
        if (checkIcon) {
          checkIcon.className = "sentence-status-icon ms-auto text-success";
          checkIcon.innerHTML = '<i class="ph-bold ph-check-circle fs-6"></i>';
        }
        if (sentenceStatusLabel) {
          sentenceStatusLabel.innerHTML = `<span class="text-success fw-semibold">✓ Đã thu âm (${evalData.overall_score}% chính xác)</span>`;
        }
        refreshSpeakingProgress();
      }
    }, 500);
  }

  async function handleSpeechResult(transcript) {
    if (!transcript) return;
    const targetText = speakingSentences[curSentIdx]?.text || "";
    const evalData = await evaluateSpeechWithBackend(targetText, transcript, curSentIdx);

    if (!recordedSentences[curSentIdx]) {
      recordedSentences[curSentIdx] = {};
    }
    recordedSentences[curSentIdx].transcript = transcript;
    recordedSentences[curSentIdx].evaluation = evalData;

    showEvaluationFeedback(evalData);

    const checkIcon = document.getElementById(`sent-check-${curSentIdx}`);
    if (checkIcon) {
      checkIcon.className = "sentence-status-icon ms-auto text-success";
      checkIcon.innerHTML = '<i class="ph-bold ph-check-circle fs-6"></i>';
    }

    if (sentenceStatusLabel) {
      sentenceStatusLabel.innerHTML = `<span class="text-success fw-semibold">✓ Đã đạt ${evalData.overall_score}% chính xác</span>`;
    }

    refreshSpeakingProgress();
  }

  if (btnRecordSpeech) {
    btnRecordSpeech.addEventListener("click", function() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });
  }

  if (btnResetSpeaking) {
    btnResetSpeaking.addEventListener("click", function() {
      if (userAudioPlayer) {
        userAudioPlayer.pause();
      }
      if (recordedSentences[curSentIdx]?.audioUrl) {
        try { URL.revokeObjectURL(recordedSentences[curSentIdx].audioUrl); } catch(e) {}
      }
      delete recordedSentences[curSentIdx];

      if (speechFeedbackBox) speechFeedbackBox.classList.add("d-none");
      if (sentenceStatusLabel) sentenceStatusLabel.innerText = "Sẵn sàng luyện phát âm";
      const checkIcon = document.getElementById(`sent-check-${curSentIdx}`);
      if (checkIcon) {
        checkIcon.className = "sentence-status-icon ms-auto text-muted";
        checkIcon.innerHTML = '<i class="ph-bold ph-circle"></i>';
      }
      updatePlaybackButton();
      refreshSpeakingProgress();
    });
  }

  // Initial setup on page ready
  updatePlaybackButton();

  // Speaking notes auto save
  const speakingNoteInput = document.getElementById("speakingNoteInput");
  let speakingNoteTimer = null;
  if (speakingNoteInput) {
    speakingNoteInput.addEventListener("input", function() {
      clearTimeout(speakingNoteTimer);
      speakingNoteTimer = setTimeout(() => {

        }).catch(err => console.error(err));
      }, 1500);

  // Initialize view
  updateSpeakingView(0);
  {% endif %}

  // ==========================================
  // Lesson Time Tracker (Thời gian mỗi bài học)
  // ==========================================
  let lessonDurationSeconds = 0;
  const timerDisplays = document.querySelectorAll(".lesson-live-timer-text");
  const durationInputs = document.querySelectorAll(".lesson-duration-seconds-input");

  function formatLessonTimer(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
  }

  setInterval(function() {
    lessonDurationSeconds++;
    const formatted = formatLessonTimer(lessonDurationSeconds);
    timerDisplays.forEach(el => {
      el.textContent = formatted;
    });
    durationInputs.forEach(input => {
      input.value = lessonDurationSeconds;
    });
  }, 1000);

  // ==========================================
  // Lesson Rating & Review System
  // ==========================================
  const currentUserId = {{ current_user.id if current_user.is_authenticated else 'null' }};
  const starPickerGroup = document.getElementById("starPickerGroup");
  const inputRatingValue = document.getElementById("inputRatingValue");
  const starRatingLabel = document.getElementById("starRatingLabel");
  const lessonRatingForm = document.getElementById("lessonRatingForm");
  const btnSubmitRating = document.getElementById("btnSubmitRating");
  const btnSubmitRatingText = document.getElementById("btnSubmitRatingText");

  const ratingDescriptions = {
    5: "⭐⭐⭐⭐⭐ Xuất sắc! Rất dễ hiểu",
    4: "⭐⭐⭐⭐ Tốt, bài học hữu ích",
    3: "⭐⭐⭐ Bình thường",
    2: "⭐⭐ Cần cải thiện thêm",
    1: "⭐ Chưa tốt"
  };

  function updateStarVisuals(activeVal) {
    if (!starPickerGroup) return;
    const buttons = starPickerGroup.querySelectorAll(".star-btn");
    buttons.forEach(btn => {
      const val = parseInt(btn.getAttribute("data-val"));
      const icon = btn.querySelector("i");
      if (icon) {
        if (val <= activeVal) {
          icon.className = "ph-fill ph-star fs-3 text-warning transition-transform";
        } else {
          icon.className = "ph-fill ph-star fs-3 text-muted opacity-25 transition-transform";
        }
      }
    });
  }

  if (starPickerGroup && inputRatingValue) {
    const starButtons = starPickerGroup.querySelectorAll(".star-btn");
    starButtons.forEach(btn => {
      btn.addEventListener("mouseenter", function() {
        const val = parseInt(this.getAttribute("data-val"));
        updateStarVisuals(val);
        if (starRatingLabel && ratingDescriptions[val]) {
          starRatingLabel.textContent = ratingDescriptions[val];
        }
      });

      btn.addEventListener("click", function() {
        const val = parseInt(this.getAttribute("data-val"));
        inputRatingValue.value = val;
        updateStarVisuals(val);
        if (starRatingLabel && ratingDescriptions[val]) {
          starRatingLabel.textContent = ratingDescriptions[val];
        }
      });
    });

    starPickerGroup.addEventListener("mouseleave", function() {
      const currentSelected = parseInt(inputRatingValue.value) || 5;
      updateStarVisuals(currentSelected);
      if (starRatingLabel && ratingDescriptions[currentSelected]) {
        starRatingLabel.textContent = ratingDescriptions[currentSelected];
      }
    });
  }

  if (lessonRatingForm) {
    lessonRatingForm.addEventListener("submit", function(e) {
      e.preventDefault();

      if (btnSubmitRating) {
        btnSubmitRating.disabled = true;
        if (btnSubmitRatingText) btnSubmitRatingText.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Đang gửi...';
      }

      const formData = new FormData(lessonRatingForm);
      const actionUrl = lessonRatingForm.getAttribute("action");

      fetch(actionUrl, {
        method: "POST",
        body: formData,
        headers: {
          "X-Requested-With": "XMLHttpRequest"
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // 1. Update big score display
          const bigAvgEl = document.getElementById("bigAverageRating");
          if (bigAvgEl) bigAvgEl.textContent = Number(data.average_rating).toFixed(1);

          const totalReviewsEl = document.getElementById("totalReviewsCountText");
          if (totalReviewsEl) totalReviewsEl.textContent = `${data.ratings_count} lượt đánh giá của học viên`;

          // 2. Update header badge if present
          const headerAvgEl = document.getElementById("headerAvgRating");
          if (headerAvgEl) headerAvgEl.textContent = Number(data.average_rating).toFixed(1);
          const headerReviewsEl = document.getElementById("headerRatingsCount");
          if (headerReviewsEl) headerReviewsEl.textContent = `(${data.ratings_count} đánh giá)`;

          // Update top layout badges if present
          document.querySelectorAll(".lesson-header-avg-val").forEach(el => {
            el.textContent = Number(data.average_rating).toFixed(1);
          });
          document.querySelectorAll(".lesson-header-count-val").forEach(el => {
            el.textContent = `(${data.ratings_count})`;
          });

          // 3. Update stars visual
          const overallStarsVisual = document.getElementById("overallStarsVisual");
          if (overallStarsVisual) {
            const avg = Number(data.average_rating);
            const fullStars = Math.floor(avg);
            const hasHalfStar = (avg - fullStars) >= 0.3;
            let starsHtml = "";
            for (let i = 1; i <= 5; i++) {
              if (i <= fullStars) {
                starsHtml += '<i class="ph-fill ph-star"></i> ';
              } else if (i === fullStars + 1 && hasHalfStar) {
                starsHtml += '<i class="ph-fill ph-star-half"></i> ';
              } else {
                starsHtml += '<i class="ph-bold ph-star text-muted opacity-25"></i> ';
              }
            }
            overallStarsVisual.innerHTML = starsHtml;
          }

          // 4. Update distribution progress bars
          if (data.distribution) {
            for (let s = 1; s <= 5; s++) {
              const bar = document.getElementById(`ratingBar-${s}`);
              const cnt = document.getElementById(`ratingCount-${s}`);
              const pct = (data.distribution.percentages && data.distribution.percentages[s]) || 0;
              const count = (data.distribution.counts && data.distribution.counts[s]) || 0;
              if (bar) bar.style.width = pct + "%";
              if (cnt) cnt.textContent = count;
            }
          }

          // 5. Update form titles & user rating badge
          const ratingFormTitle = document.getElementById("ratingFormTitle");
          if (ratingFormTitle) ratingFormTitle.textContent = "Chỉnh sửa đánh giá của bạn";
          if (btnSubmitRatingText) btnSubmitRatingText.textContent = "Cập nhật đánh giá";

          let userRatedBadge = document.getElementById("userRatedBadge");
          if (!userRatedBadge) {
            const badgeContainer = document.querySelector("#lessonRatingSection .p-3\\.5, #lessonRatingSection [style*='linear-gradient'] > div:first-child");
            if (badgeContainer) {
              userRatedBadge = document.createElement("span");
              userRatedBadge.id = "userRatedBadge";
              userRatedBadge.className = "badge bg-white text-success border border-success-subtle rounded-pill px-2.5 py-1 small fw-semibold";
              badgeContainer.appendChild(userRatedBadge);
            }
          }
          if (userRatedBadge) {
            userRatedBadge.textContent = `✓ Bạn đã chấm ${data.rating.rating} sao`;
          }

          // 6. Update or prepend review card in recent reviews list
          const placeholder = document.getElementById("noReviewsPlaceholder");
          if (placeholder) placeholder.remove();

          const reviewsContainer = document.getElementById("reviewsListContainer");
          const existingUserCard = (currentUserId ? document.querySelector(`[data-user-id="${currentUserId}"]`) : null) || document.getElementById(`reviewCard-user-${data.rating.id}`) || document.getElementById(`reviewCard-${data.rating.id}`);
          
          let starsMarkup = "";
          for (let s = 1; s <= 5; s++) {
            starsMarkup += (s <= data.rating.rating) ? '<i class="ph-fill ph-star"></i>' : '<i class="ph-bold ph-star text-muted opacity-25"></i>';
          }

          const reviewTextMarkup = data.rating.review_text ? `
            <p class="text-secondary small mb-0 mt-1" style="font-size: 0.84rem; line-height: 1.5;">
              ${data.rating.review_text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
            </p>
          ` : '';

          const userInitial = (data.rating.user_name || "B")[0].toUpperCase();

          const cardHtml = `
            <div class="d-flex justify-content-between align-items-start mb-1.5">
              <div class="d-flex align-items-center gap-2.5">
                <div class="rounded-circle d-flex align-items-center justify-content-center bg-primary text-white fw-bold small flex-shrink-0" style="width: 32px; height: 32px; font-size: 0.8rem;">
                  ${userInitial}
                </div>
                <div>
                  <div class="d-flex align-items-center gap-1.5">
                    <strong class="text-dark small d-block mb-0">${data.rating.user_name || "Bạn"}</strong>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-1.5 py-0.5" style="font-size: 0.65rem;">Bạn</span>
                  </div>
                  <div class="text-warning" style="font-size: 0.82rem;">
                    ${starsMarkup}
                  </div>
                </div>
              </div>
              <span class="text-muted small" style="font-size: 0.74rem;">Vừa xong</span>
            </div>
            ${reviewTextMarkup}
          `;

          if (existingUserCard) {
            existingUserCard.innerHTML = cardHtml;
          } else if (reviewsContainer) {
            const newCard = document.createElement("div");
            newCard.id = `reviewCard-${data.rating.id}`;
            if (currentUserId) newCard.setAttribute("data-user-id", currentUserId);
            newCard.className = "p-3 bg-white rounded-3 border shadow-2xs transition-hover";
            newCard.style.borderColor = "var(--border-light)";
            newCard.innerHTML = cardHtml;
            reviewsContainer.insertBefore(newCard, reviewsContainer.firstChild);

            const reviewsHeaderCount = document.getElementById("recentReviewsHeaderCount");
            if (reviewsHeaderCount) {
              const currentVal = parseInt(reviewsHeaderCount.textContent) || 0;
              reviewsHeaderCount.textContent = currentVal + 1;
            }
          }

          // Show floating success notification
          const notif = document.createElement("div");
          notif.className = "alert alert-success border-0 shadow-sm rounded-pill py-2 px-3.5 position-fixed bottom-0 start-50 translate-middle-x mb-4 d-flex align-items-center gap-2 z-index-1050";
          notif.style.zIndex = "9999";
          notif.innerHTML = '<i class="ph-bold ph-check-circle fs-5"></i> <span>' + data.message + '</span>';
          document.body.appendChild(notif);
          setTimeout(() => {
            notif.style.transition = "opacity 0.4s ease, transform 0.4s ease";
            notif.style.opacity = "0";
            notif.style.transform = "translate(-50%, 20px)";
            setTimeout(() => notif.remove(), 400);
          }, 3000);
        } else {
          alert(data.message || "Có lỗi xảy ra khi lưu đánh giá.");
        }
      })
      .catch(err => {
        console.error("Lỗi gửi đánh giá:", err);
        alert("Không thể kết nối đến máy chủ. Vui lòng thử lại sau!");
      })
      .finally(() => {
        if (btnSubmitRating) {
          btnSubmitRating.disabled = false;
          if (btnSubmitRatingText) {
            btnSubmitRatingText.innerHTML = (userRatingExists ? 'Cập nhật đánh giá' : 'Gửi đánh giá');
          }
        }
      });
    });
  }
  const userRatingExists = {% if user_rating %}true{% else %}false{% endif %};
});
</script>
