# ==============================================================================
# EnglishMate Nginx Upstream Load Balancer Configuration
# High Availability, Gzip/Brotli Compression, Micro-caching & SSL Termination
# ==============================================================================

# Upstream Application Cluster (Load Balancing Pool)
upstream englishmate_cluster {
    # Load balancing algorithms:
    # 1. Round-robin (default): Distribute evenly across instances
    # 2. least_conn: Forward request to instance with fewest active connections
    # 3. ip_hash: Session persistence based on client IP
    least_conn;

    # Primary application worker nodes (Gunicorn instances)
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=5;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=5;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s weight=5;

    # Standby backup node (activated only when all primary servers are down)
    server 127.0.0.1:5003 backup;

    # Keepalive connections pool to upstream servers
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# HTTP Server -> Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name englishmate.vn www.englishmate.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Load Balancer Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name englishmate.vn www.englishmate.vn;

    # SSL TLS Configuration & Modern Ciphers
    ssl_certificate /etc/letsencrypt/live/englishmate.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englishmate.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request Size Limits & Buffer Tuning
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression Module
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets Fast-path & Aggressive Browser Caching
    location /static/ {
        alias /var/www/englishmate/app/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Uploads directory
    location /static/uploads/ {
        alias /var/www/englishmate/app/frontend/static/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # API Endpoints (Strict Rate Limiting)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://englishmate_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Main Application Proxy (Load Balanced Across Cluster)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://englishmate_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts & Buffering
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;

        # Failover handling: Retry on 502/503/504
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/englishmate/app/frontend/templates/errors/;
        internal;
    }
}
